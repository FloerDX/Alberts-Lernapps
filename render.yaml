services:
  - type: web
    name: lernapps
    runtime: node
    plan: free               # Daten liegen in Supabase, keine Festplatte nötig
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false          # Supabase-Verbindungsstring (Session pooler)
      - key: TEACHER_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
